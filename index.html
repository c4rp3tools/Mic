    <script>
        // ============================================================
        // CONFIGURACIÓN - CLAVES
        // ============================================================
        const PERPLEXITY_KEY = "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";
        const YOUTUBE_API_KEY = "AIzaSyCPjS1PwQhr2ijIpoWwmxIxEHITuwvoF5Q";

        // ============================================================
        // ESTADO
        // ============================================================
        let currentTracks = [];
        let currentIndex = -1;
        let playing = false;
        let isProcessing = false;
        let imageData = null;
        let recognition = null;
        let isListening = false;

        // ============================================================
        // DOM REFS
        // ============================================================
        const playlistEl = document.getElementById('playlist');
        const trackName = document.getElementById('trackName');
        const trackArtist = document.getElementById('trackArtist');
        const voiceMsg = document.getElementById('voiceMsg');
        const statusText = document.getElementById('statusText');
        const eq = document.getElementById('eq');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const ytFrame = document.getElementById('ytFrame');
        const micBtn = document.getElementById('micBtn');

        const dropZone = document.getElementById('dropZone');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const btnAnalyze = document.getElementById('btnAnalyze');
        const statusMsg = document.getElementById('statusMsg');

        // ============================================================
        // FUNCIONES UI
        // ============================================================
        function setStatus(text, isPlayingState = false) {
            statusText.textContent = text;
            statusText.style.color = isPlayingState ? '#1a5a1a' : '#23431c';
        }

        function setVoiceMsg(text) {
            voiceMsg.textContent = text;
        }

        function showStatusMsg(text, type = 'info') {
            statusMsg.textContent = text;
            statusMsg.className = 'status-msg';
            if (type === 'success') statusMsg.classList.add('success');
            if (type === 'error') statusMsg.classList.add('error');
        }

        function setLoading(isLoading) {
            btnAnalyze.disabled = isLoading || !imageData;
            btnAnalyze.textContent = isLoading ? '⏳...' : '🤖 ANALIZAR';
        }

        // ============================================================
        // MANEJO DE IMAGEN (opcional, para compatibilidad)
        // ============================================================
        function handleImage(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                imageData = e.target.result;
                imagePreview.src = imageData;
                imagePreview.classList.add('show');
                uploadPlaceholder.style.display = 'none';
                btnAnalyze.disabled = false;
                showStatusMsg('✅ imagen cargada', 'success');
            };
            reader.readAsDataURL(file);
        }

        dropZone.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', function() {
            if (this.files && this.files[0]) handleImage(this.files[0]);
        });
        dropZone.addEventListener('dragover', e => { e.preventDefault();
            dropZone.style.background = 'rgba(255,255,255,0.4)'; });
        dropZone.addEventListener('dragleave', e => { e.preventDefault();
            dropZone.style.background = 'rgba(255,255,255,0.2)'; });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.background = 'rgba(255,255,255,0.2)';
            const files = e.dataTransfer.files;
            if (files && files[0] && files[0].type.startsWith('image/')) {
                handleImage(files[0]);
                imageInput.files = files;
            } else {
                showStatusMsg('⚠️ sube una imagen', 'error');
            }
        });

        btnAnalyze.addEventListener('click', async function() {
            if (!imageData) { showStatusMsg('⚠️ sube una imagen', 'error'); return; }
            if (isProcessing) return;
            isProcessing = true;
            setLoading(true);
            showStatusMsg('🔍 analizando cartel...', 'info');
            setStatus('ANALIZANDO...');
            try {
                const prompt =
                    `Analiza este cartel de festival y extrae el nombre de TODOS los artistas que aparecen. Devuelve SOLO un JSON con esta estructura: {"artistas": ["Artista 1", "Artista 2", ...]}. Si hay más de 20, devuelve los 20 primeros.`;
                const response = await fetch('https://api.perplexity.ai/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${PERPLEXITY_KEY}` },
                    body: JSON.stringify({
                        model: "sonar",
                        messages: [{ role: "system",
                                content: "Eres un asistente que extrae nombres de artistas de carteles de festivales. Devuelves JSON." },
                            { role: "user", content: [{ type: "text", text: prompt }, { type: "image_url",
                                    image_url: { url: imageData } }] }],
                        temperature: 0.2,
                        max_tokens: 500
                    })
                });
                if (!response.ok) throw new Error(`Error ${response.status}`);
                const data = await response.json();
                const contenido = data.choices[0].message.content;
                const jsonMatch = contenido.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error('No se pudo extraer JSON');
                const parsed = JSON.parse(jsonMatch[0]);
                const artistas = parsed.artistas || [];
                if (artistas.length === 0) throw new Error('No se encontraron artistas');
                showStatusMsg(`✅ ${artistas.length} artistas encontrados`, 'success');
                setStatus('BUSCANDO CANCIONES...');
                await buscarCancionesArtistas(artistas);
            } catch (error) {
                showStatusMsg(`❌ ${error.message}`, 'error');
                setStatus('ERROR');
            } finally {
                isProcessing = false;
                setLoading(false);
            }
        });

        // ============================================================
        // ASISTENTE DE VOZ (NUCLEO)
        // ============================================================
        function initVoiceAssistant() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                setVoiceMsg('❌ Tu navegador no soporta voz');
                micBtn.style.opacity = '0.3';
                micBtn.title = 'Voz no soportada';
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
                setVoiceMsg('🎤 Escuchando... habla ahora');
                setStatus('ESCUCHANDO');
            };

            recognition.onend = function() {
                isListening = false;
                micBtn.classList.remove('listening');
                if (!isProcessing) {
                    setVoiceMsg('🎤 pulsa el micrófono y habla');
                    setStatus('LISTO');
                }
            };

            recognition.onresult = function(event) {
                let final = '';
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        final += event.results[i][0].transcript;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                const text = final || interim;
                if (text) {
                    setVoiceMsg(`🗣️ "${text}"`);
                    if (final) {
                        // Procesar el comando completo
                        procesarComandoVoz(final);
                    }
                }
            };

            recognition.onerror = function(event) {
                console.error('Error de voz:', event.error);
                if (event.error === 'not-allowed') {
                    setVoiceMsg('⚠️ Permiso de micrófono denegado');
                    setStatus('ERROR');
                } else if (event.error === 'no-speech') {
                    setVoiceMsg('🎤 No te he oído, intenta de nuevo');
                    setStatus('LISTO');
                } else {
                    setVoiceMsg(`⚠️ Error: ${event.error}`);
                    setStatus('ERROR');
                }
                micBtn.classList.remove('listening');
                isListening = false;
            };
        }

        // ============================================================
        // PROCESAR COMANDO DE VOZ CON IA
        // ============================================================
        async function procesarComandoVoz(texto) {
            if (isProcessing) return;
            isProcessing = true;
            micBtn.classList.remove('listening');
            micBtn.classList.add('processing');
            setStatus('PROCESANDO...');
            setVoiceMsg(`🤖 procesando: "${texto}"`);

            try {
                // Usar Perplexity para interpretar el comando
                const prompt =
                    `Interpreta este comando de voz para un reproductor de música: "${texto}"

                IMPORTANTE: Debes devolver SOLO un JSON con esta estructura:
                {
                  "tipo": "artista" o "cancion",
                  "artista": "Nombre del artista" (si es artista o canción específica),
                  "cancion": "Nombre de la canción" (si es canción específica, sino null)
                }

                Ejemplos:
                - "ponme música de Vetusta Morla" → {"tipo":"artista","artista":"Vetusta Morla","cancion":null}
                - "quiero escuchar Do I Wanna Know de Arctic Monkeys" → {"tipo":"cancion","artista":"Arctic Monkeys","cancion":"Do I Wanna Know"}
                - "pon canciones de Fillas de Cassandra" → {"tipo":"artista","artista":"Fillas de Cassandra","cancion":null}`;

                const response = await fetch('https://api.perplexity.ai/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${PERPLEXITY_KEY}` },
                    body: JSON.stringify({
                        model: "sonar",
                        messages: [{ role: "system",
                                content: "Eres un asistente que interpreta comandos de voz para música. Devuelves JSON." },
                            { role: "user", content: prompt }],
                        temperature: 0.2,
                        max_tokens: 300
                    })
                });

                if (!response.ok) throw new Error(`Error ${response.status}`);

                const data = await response.json();
                const contenido = data.choices[0].message.content;
                const jsonMatch = contenido.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error('No se pudo interpretar el comando');

                const parsed = JSON.parse(jsonMatch[0]);
                setVoiceMsg(`🎯 buscando: ${parsed.tipo === 'artista' ? 'artista' : 'canción'} "${parsed.artista || parsed.cancion}"`);

                if (parsed.tipo === 'artista' && parsed.artista) {
                    // Buscar canciones del artista
                    await buscarCancionesArtistas([parsed.artista]);
                } else if (parsed.tipo === 'cancion' && parsed.artista && parsed.cancion) {
                    // Buscar canción específica
                    await buscarCancionEspecifica(parsed.artista, parsed.cancion);
                } else {
                    throw new Error('No entendí lo que pediste');
                }

            } catch (error) {
                console.error('Error:', error);
                setVoiceMsg(`❌ ${error.message}`);
                setStatus('ERROR');
                showStatusMsg(`❌ ${error.message}`, 'error');
            } finally {
                isProcessing = false;
                micBtn.classList.remove('processing');
                if (!isListening) {
                    setVoiceMsg('🎤 pulsa el micrófono y habla');
                    setStatus('LISTO');
                }
            }
        }

        // ============================================================
        // BUSCAR CANCIÓN ESPECÍFICA
        // ============================================================
        async function buscarCancionEspecifica(artista, cancion) {
            try {
                const query = `${artista} ${cancion}`;
                const url =
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=1&key=${YOUTUBE_API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    const track = {
                        band: artista,
                        song: data.items[0].snippet.title,
                        id: data.items[0].id.videoId
                    };
                    currentTracks = [track];
                    renderPlaylist();
                    showStatusMsg(`✅ ${artista} → ${cancion}`, 'success');
                    setStatus('LISTO');
                    loadAndPlay(0);
                    setVoiceMsg(`▶️ reproduciendo ${cancion}`);
                } else {
                    throw new Error(`No se encontró "${cancion}" de ${artista}`);
                }
            } catch (error) {
                throw new Error(`No se encontró la canción: ${error.message}`);
            }
        }

        // ============================================================
        // BUSCAR CANCIONES EN YOUTUBE
        // ============================================================
        async function buscarCancionesArtistas(artistas, maxSongs = 20) {
            playlistEl.innerHTML = `<div class="loading">⏳ buscando ${artistas.length} artistas...</div>`;

            const allTracks = [];
            for (const artista of artistas) {
                try {
                    const canciones = await buscarCancionesYoutube(artista, maxSongs);
                    if (canciones.length > 0) {
                        allTracks.push({ band: artista, songs: canciones });
                    }
                } catch (e) { console.error(e); }
            }

            currentTracks = [];
            allTracks.forEach(artistData => {
                artistData.songs.forEach(song => {
                    currentTracks.push({ band: artistData.band, song: song.title, id: song.id });
                });
            });

            if (currentTracks.length === 0) {
                playlistEl.innerHTML = `<div class="loading">❌ no se encontraron canciones</div>`;
                showStatusMsg('❌ no se encontraron canciones', 'error');
                setVoiceMsg('❌ no encontré canciones de ese artista');
                return;
            }

            renderPlaylist();
            const artistasConCanciones = allTracks.length;
            showStatusMsg(`✅ ${artistasConCanciones} artistas, ${currentTracks.length} canciones`, 'success');
            setStatus('LISTO');
            setVoiceMsg(`🎵 ${currentTracks.length} canciones cargadas`);
            if (currentTracks.length > 0) {
                loadAndPlay(0);
            }
        }

        async function buscarCancionesYoutube(artista, limit = 20) {
            try {
                const url =
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(artista)}&type=video&maxResults=${limit}&key=${YOUTUBE_API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.error) return [];
                if (data.items && data.items.length > 0) {
                    return data.items.map(item => ({ id: item.id.videoId, title: item.snippet.title }));
                }
                return [];
            } catch (error) {
                return [];
            }
        }

        // ============================================================
        // REPRODUCTOR
        // ============================================================
        function ytEmbedSrc(videoId) {
            return `https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=1&playsinline=1&rel=0&modestbranding=1`;
        }

        function postCmd(func, args) {
            if (!ytFrame.contentWindow) return;
            ytFrame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args || [] }), '*');
        }

        function highlightActive(i) {
            document.querySelectorAll('.track').forEach(el => el.classList.remove('active'));
            const el = document.querySelector(`.track[data-index="${i}"]`);
            if (el) el.classList.add('active');
        }

        function setPlayingUI(isPlaying) {
            playing = isPlaying;
            if (isPlaying) {
                statusText.textContent = "REPRODUCIENDO";
                eq.classList.remove('paused');
                playBtn.textContent = "❚❚";
            } else {
                statusText.textContent = "PAUSA";
                eq.classList.add('paused');
                playBtn.textContent = "▶";
            }
        }

        function loadAndPlay(i) {
            if (currentTracks.length === 0) return;
            currentIndex = (i + currentTracks.length) % currentTracks.length;
            const t = currentTracks[currentIndex];
            trackName.textContent = t.song;
            trackArtist.textContent = t.band;
            highlightActive(currentIndex);
            statusText.textContent = "CARGANDO...";
            eq.classList.add('paused');
            ytFrame.src = ytEmbedSrc(t.id);
        }

        function nextTrack() {
            if (currentTracks.length === 0) return;
            loadAndPlay(currentIndex + 1);
        }

        function prevTrack() {
            if (currentTracks.length === 0) return;
            loadAndPlay(currentIndex - 1);
        }

        function renderPlaylist() {
            if (currentTracks.length === 0) {
                playlistEl.innerHTML = `<div class="loading">🎤 di "ponme música de..."</div>`;
                return;
            }

            let html = '';
            currentTracks.forEach((t, i) => {
                html += `
                    <div class="track" data-index="${i}">
                        <span class="num">${String(i + 1).padStart(2, '0')}</span>
                        <span class="info"><span class="band">${t.band}</span> — <span class="song">${t.song}</span></span>
                    </div>
                `;
            });
            playlistEl.innerHTML = html;
            document.querySelectorAll('.track').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.dataset.index);
                    loadAndPlay(idx);
                });
            });
        }

        // ============================================================
        // EVENTOS DEL REPRODUCTOR
        // ============================================================
        playBtn.addEventListener('click', () => {
            if (currentTracks.length === 0) { showStatusMsg('⚠️ no hay canciones', 'error'); return; }
            if (currentIndex === -1) { loadAndPlay(0); return; }
            if (playing) { postCmd('pauseVideo');
                setPlayingUI(false); } else { postCmd('playVideo');
                setPlayingUI(true); }
        });

        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);

        volumeSlider.addEventListener('input', () => {
            postCmd('setVolume', [Number(volumeSlider.value)]);
        });

        window.addEventListener('message', (event) => {
            if (typeof event.data !== 'string') return;
            let data;
            try { data = JSON.parse(event.data); } catch (e) { return; }
            if (data.event === 'onStateChange') {
                if (data.info === 0) { nextTrack(); } else if (data.info === 1) { setPlayingUI(true); } else if (data
                    .info === 2) { setPlayingUI(false); }
            }
            if (data.event === 'onReady') {
                postCmd('setVolume', [Number(volumeSlider.value)]);
            }
        });

        // ============================================================
        // MICRÓFONO
        // ============================================================
        micBtn.addEventListener('click', function() {
            if (!recognition) {
                initVoiceAssistant();
                setTimeout(() => {
                    if (recognition) {
                        try { recognition.start(); } catch (e) {}
                    }
                }, 300);
                return;
            }

            if (isListening) {
                recognition.stop();
                return;
            }

            if (isProcessing) {
                setVoiceMsg('⏳ espera a que termine...');
                return;
            }

            try {
                recognition.start();
            } catch (e) {
                // Si ya está iniciado, lo reiniciamos
                try { recognition.stop(); } catch (ex) {}
                setTimeout(() => {
                    try { recognition.start(); } catch (err) {}
                }, 300);
            }
        });

        // ============================================================
        // INICIO
        // ============================================================
        renderPlaylist();
        setStatus('LISTO');
        setVoiceMsg('🎤 pulsa el micrófono y habla');
        showStatusMsg('🎤 habla para buscar música', 'info');

        // Inicializar reconocimiento en background
        setTimeout(initVoiceAssistant, 500);

        console.log('🎤 FESTIPLAYER 2000 - Asistente de voz');
        console.log('🔑 Perplexity Key cargada');
    </script>
